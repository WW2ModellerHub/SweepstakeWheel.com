name: Validate site data and affiliate links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check generated files
        run: node scripts/build-derived.mjs --check
      - name: Validate site
        run: node scripts/validate-site.mjs
